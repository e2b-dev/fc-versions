name: Manual Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Firecracker version tag (e.g., v1.14.1)'
        required: true
        type: string
      commit_hash:
        description: 'Full commit hash to build (optional, defaults to tag commit)'
        required: false
        type: string
      build_amd64:
        description: 'Build for amd64 architecture'
        required: false
        type: boolean
        default: true
      build_arm64:
        description: 'Build for arm64 architecture'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version_name: ${{ steps.version.outputs.version_name }}
      commit_hash: ${{ steps.version.outputs.commit_hash }}
      tag: ${{ steps.version.outputs.tag }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      skip_build: ${{ steps.matrix.outputs.skip_build }}
    steps:
      - name: Validate inputs
        run: |
          if [[ "${{ inputs.build_amd64 }}" != "true" && "${{ inputs.build_arm64 }}" != "true" ]]; then
            echo "Error: At least one architecture must be selected"
            exit 1
          fi

      - name: Resolve tag and commit hash
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ inputs.tag }}"
          input_hash="${{ inputs.commit_hash }}"

          if [[ -n "$input_hash" ]]; then
            # Commit hash provided: validate it exists
            echo "Validating commit $input_hash..."
            commit_hash=$(gh api "repos/e2b-dev/firecracker/commits/$input_hash" --jq '.sha' 2>/dev/null) || {
              echo "Error: Commit $input_hash does not exist in e2b-dev/firecracker repository"
              exit 1
            }
          else
            # No commit hash: look up from tag
            echo "Looking up commit hash for tag $tag..."
            commit_hash=$(gh api "repos/e2b-dev/firecracker/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null) || {
              echo "Error: Tag $tag does not exist in e2b-dev/firecracker repository"
              exit 1
            }

            # Handle annotated tags (need to dereference to get commit SHA)
            # If the ref points to a tag object, we need to get the commit it points to
            tag_object=$(gh api "repos/e2b-dev/firecracker/git/tags/$commit_hash" 2>/dev/null || echo "")
            if [[ -n "$tag_object" ]]; then
              # Successfully fetched tag object, extract the commit SHA it points to
              commit_hash=$(echo "$tag_object" | jq -r '.object.sha')
            fi
          fi

          short_hash="${commit_hash:0:7}"
          version_name="${tag}_${short_hash}"

          echo "Tag: $tag"
          echo "Full commit hash: $commit_hash"
          echo "Short hash: $short_hash"
          echo "Version name: $version_name"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit_hash=$commit_hash" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"

      - name: Check CI status for commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit_hash="${{ steps.version.outputs.commit_hash }}"
          echo "Checking CI status for commit $commit_hash..."

          # Check commit status API
          status_response=$(gh api "/repos/e2b-dev/firecracker/commits/$commit_hash/status" 2>/dev/null || echo '{"state":"unknown","total_count":0}')
          status=$(echo "$status_response" | jq -r '.state')
          status_count=$(echo "$status_response" | jq -r '.total_count')

          # Check check-runs API
          check_response=$(gh api "/repos/e2b-dev/firecracker/commits/$commit_hash/check-runs" 2>/dev/null || echo '{"total_count":0}')
          check_count=$(echo "$check_response" | jq -r '.total_count')
          check_conclusion=$(echo "$check_response" | jq -r '
            if .total_count == 0 then "no_checks"
            elif ([.check_runs[].status] | any(. == "in_progress" or . == "queued")) then "pending"
            elif ([.check_runs[].conclusion] | any(. == "failure" or . == "cancelled" or . == "timed_out")) then "failure"
            elif ([.check_runs[].conclusion] | all(. == "success" or . == "skipped" or . == "neutral")) then "success"
            else "unknown"
            end
          ')

          echo "Status API: state=$status, count=$status_count"
          echo "Check-runs API: conclusion=$check_conclusion, count=$check_count"

          if [[ "$status" == "failure" ]] || [[ "$check_conclusion" == "failure" ]]; then
            echo "::error::CI failed for commit $commit_hash - refusing to build"
            exit 1
          elif [[ "$check_conclusion" == "pending" ]] || ([[ "$status" == "pending" ]] && [[ "$status_count" -gt 0 ]]); then
            echo "::error::CI is still running for commit $commit_hash - refusing to build"
            exit 1
          elif [[ "$status" == "success" ]] || [[ "$check_conclusion" == "success" ]]; then
            echo "CI passed for commit $commit_hash"
          elif [[ "$status_count" -eq 0 ]] && [[ "$check_count" -eq 0 ]]; then
            echo "::warning::No CI checks found for commit $commit_hash - proceeding anyway"
          else
            echo "::warning::Could not definitively verify CI status (status=$status, check_conclusion=$check_conclusion) - proceeding anyway"
          fi

      - name: Setup GCS credentials
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Check existing artifacts and generate build matrix
        id: matrix
        env:
          GH_TOKEN: ${{ github.token }}
          GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_NAME }}
        run: |
          version_name="${{ steps.version.outputs.version_name }}"

          # Track what needs to be built
          need_amd64=false
          need_arm64=false

          # Check GitHub release for existing artifacts
          release_assets=""
          if gh release view "$version_name" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $version_name exists"
            release_assets=$(gh release view "$version_name" --repo "${{ github.repository }}" --json assets -q '.assets[].name')
          else
            echo "Release $version_name does not exist"
          fi

          # Check each requested architecture
          for arch in amd64 arm64; do
            # Skip if not requested
            if [[ "$arch" == "amd64" && "${{ inputs.build_amd64 }}" != "true" ]]; then
              continue
            fi
            if [[ "$arch" == "arm64" && "${{ inputs.build_arm64 }}" != "true" ]]; then
              continue
            fi

            gcs_exists=false
            release_exists=false

            # Check GCS
            gcs_path="gs://${GCP_BUCKET_NAME}/firecrackers/${version_name}/${arch}/firecracker"
            if gcloud storage ls "$gcs_path" >/dev/null 2>&1; then
              gcs_exists=true
              echo "GCS: $arch artifact exists"
            else
              echo "GCS: $arch artifact missing"
            fi

            # Check GitHub release
            if echo "$release_assets" | grep -q "^firecracker-${arch}$"; then
              release_exists=true
              echo "Release: $arch artifact exists"
            else
              echo "Release: $arch artifact missing"
            fi

            # Need to build if missing from either location
            if [[ "$gcs_exists" == "false" || "$release_exists" == "false" ]]; then
              if [[ "$arch" == "amd64" ]]; then
                need_amd64=true
              else
                need_arm64=true
              fi
            fi
          done

          # Check if nothing to do
          if [[ "$need_amd64" == "false" && "$need_arm64" == "false" ]]; then
            echo ""
            echo "=============================================="
            echo "SKIPPING BUILD: All requested artifacts already exist"
            echo "=============================================="
            echo ""
            echo "The following artifacts were found:"
            echo "  - GCS: gs://${GCP_BUCKET_NAME}/firecrackers/${version_name}/"
            echo "  - GitHub Release: https://github.com/${{ github.repository }}/releases/tag/${version_name}"
            echo ""
            echo "To rebuild, first delete the existing artifacts from GCS and/or GitHub."
            echo ""
            echo "::notice::Skipped build - all requested artifacts already exist in both GCS and GitHub release"
            echo "skip_build=true" >> "$GITHUB_OUTPUT"
            echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip_build=false" >> "$GITHUB_OUTPUT"

          # Generate build matrix
          matrix='{"include":['
          first=true

          if [[ "$need_amd64" == "true" ]]; then
            matrix+='{"arch":"amd64","runner":"ubuntu-24.04"}'
            first=false
          fi

          if [[ "$need_arm64" == "true" ]]; then
            if [[ "$first" == "false" ]]; then
              matrix+=','
            fi
            matrix+='{"arch":"arm64","runner":"ubuntu-24.04-arm"}'
          fi

          matrix+=']}'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "Build matrix: $matrix"

  build:
    needs: validate
    if: needs.validate.outputs.skip_build != 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Build Firecracker ${{ needs.validate.outputs.version_name }} (${{ matrix.arch }})
        run: ./build.sh "${{ needs.validate.outputs.tag }}" "${{ needs.validate.outputs.commit_hash }}" "${{ needs.validate.outputs.version_name }}" "${{ matrix.arch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: firecracker-${{ needs.validate.outputs.version_name }}-${{ matrix.arch }}
          path: builds/
          retention-days: 7

  publish:
    needs: [validate, build]
    if: needs.validate.outputs.skip_build != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./builds
          merge-multiple: true

      - name: Display build artifacts
        run: |
          echo "Build artifacts:"
          find ./builds -type f | head -50

      - name: Setup Service Account
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Upload to GCS (skip existing)
        env:
          GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_NAME }}
        run: |
          version_name="${{ needs.validate.outputs.version_name }}"

          for arch in amd64 arm64; do
            local_path="./builds/$version_name/$arch/firecracker"
            if [[ ! -f "$local_path" ]]; then
              continue
            fi

            gcs_path="gs://${GCP_BUCKET_NAME}/firecrackers/${version_name}/${arch}/firecracker"

            if gcloud storage ls "$gcs_path" >/dev/null 2>&1; then
              echo "GCS: $arch artifact already exists, skipping"
            else
              echo "GCS: Uploading $arch artifact..."
              gcloud storage cp "$local_path" "$gcs_path"
            fi
          done

      - name: Create or update GitHub release (skip existing artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version_name="${{ needs.validate.outputs.version_name }}"

          # Configure git for tagging
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create release if it doesn't exist
          if ! gh release view "$version_name" >/dev/null 2>&1; then
            echo "Creating new release $version_name..."

            # Create and push tag if it doesn't exist
            if ! git rev-parse "refs/tags/$version_name" >/dev/null 2>&1; then
              git tag "$version_name"
              git push origin "$version_name"
            fi

            gh release create "$version_name" \
              --title "Firecracker $version_name" \
              --notes "Firecracker build: $version_name (manual build from commit ${{ needs.validate.outputs.commit_hash }})"
          fi

          # Get existing release assets
          existing_assets=$(gh release view "$version_name" --json assets -q '.assets[].name')

          # Upload missing artifacts
          for arch in amd64 arm64; do
            local_path="./builds/$version_name/$arch/firecracker"
            if [[ ! -f "$local_path" ]]; then
              continue
            fi

            asset_name="firecracker-${arch}"

            if echo "$existing_assets" | grep -q "^${asset_name}$"; then
              echo "Release: $arch artifact already exists, skipping"
            else
              echo "Release: Uploading $arch artifact..."
              # Create temp file with correct name
              tmp_file=$(mktemp -d)/${asset_name}
              cp "$local_path" "$tmp_file"
              gh release upload "$version_name" "$tmp_file"
              rm -f "$tmp_file"
            fi

            # Upload amd64 binary also as "firecracker" for backwards compatibility
            if [[ "$arch" == "amd64" ]]; then
              if echo "$existing_assets" | grep -q "^firecracker$"; then
                echo "Release: legacy 'firecracker' artifact already exists, skipping"
              else
                echo "Release: Uploading legacy 'firecracker' artifact for backwards compatibility..."
                tmp_file=$(mktemp -d)/firecracker
                cp "$local_path" "$tmp_file"
                gh release upload "$version_name" "$tmp_file"
                rm -f "$tmp_file"
              fi
            fi
          done

          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/$version_name"
