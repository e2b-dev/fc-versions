name: Manual Build & Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Firecracker version tag (e.g., v1.14.1). If omitted, uses most recent tag from commit.'
        required: false
        type: string
      commit_hash:
        description: 'Full commit hash to build. Required if tag is omitted.'
        required: false
        type: string
      build_amd64:
        description: 'Build for amd64 architecture'
        required: false
        type: boolean
        default: true
      build_arm64:
        description: 'Build for arm64 architecture'
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version_name: ${{ steps.validate.outputs.version_name }}
      commit_hash: ${{ steps.validate.outputs.commit_hash }}
      build_matrix: ${{ steps.validate.outputs.build_matrix }}
      has_new_artifacts: ${{ steps.validate.outputs.has_new_artifacts }}
    steps:
      - uses: actions/checkout@v6

      - name: Mint firecracker-repo token
        id: fc_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FIRECRACKER_APP_ID }}
          private-key: ${{ secrets.FIRECRACKER_APP_PRIVATE_KEY }}
          owner: e2b-dev
          repositories: firecracker

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@v2.1.1

      - name: Install python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON }}

      - name: Validate inputs and resolve version
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          FIRECRACKER_GH_TOKEN: ${{ steps.fc_token.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/validate.py \
            --tag "${{ inputs.tag }}" \
            --commit-hash "${{ inputs.commit_hash }}" \
            --build-amd64 "${{ inputs.build_amd64 }}" \
            --build-arm64 "${{ inputs.build_arm64 }}"


  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.validate.outputs.build_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Check if artifact exists in release
        id: check_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name="${{ needs.validate.outputs.version_name }}"
          arch="${{ matrix.arch }}"

          # Skip only if both the prod and the debug binaries already exist.
          assets=$(gh release view "$version_name" --json assets -q ".assets[].name" 2>/dev/null || true)
          if echo "$assets" | grep -q "^firecracker-${arch}$" \
             && echo "$assets" | grep -q "^firecracker-debug-${arch}$"; then
            echo "Release: $arch artifacts (prod + debug) already exist, skipping build"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "Release: $arch artifacts missing, will build"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Mint firecracker-repo token
        id: fc_token
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FIRECRACKER_APP_ID }}
          private-key: ${{ secrets.FIRECRACKER_APP_PRIVATE_KEY }}
          owner: e2b-dev
          repositories: firecracker

      - name: Build Firecracker ${{ needs.validate.outputs.version_name }} (${{ matrix.arch }})
        if: steps.check_release.outputs.skip != 'true'
        env:
          FIRECRACKER_REPO_TOKEN: ${{ steps.fc_token.outputs.token }}
        run: ./build.sh "${{ needs.validate.outputs.commit_hash }}" "${{ needs.validate.outputs.version_name }}" "${{ matrix.arch }}"

      - name: Upload build artifact
        if: steps.check_release.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: firecracker-${{ needs.validate.outputs.version_name }}-${{ matrix.arch }}
          path: builds/
          retention-days: 7

  publish:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        if: needs.validate.outputs.has_new_artifacts == 'true'
        uses: actions/download-artifact@v8
        with:
          path: ./builds
          merge-multiple: true

      - name: Display build artifacts
        if: needs.validate.outputs.has_new_artifacts == 'true'
        run: |
          echo "Build artifacts:"
          find ./builds -type f | head -50

      - name: Create or update GitHub release (skip existing artifacts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          version_name="${{ needs.validate.outputs.version_name }}"

          # Configure git for tagging
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Create release if it doesn't exist
          if ! gh release view "$version_name" >/dev/null 2>&1; then
            echo "Creating new release $version_name..."

            # Create and push tag if it doesn't exist
            if ! git rev-parse "refs/tags/$version_name" >/dev/null 2>&1; then
              git tag "$version_name"
              git push origin "$version_name"
            fi

            gh release create "$version_name" \
              --title "Firecracker $version_name" \
              --notes "Firecracker build: $version_name (manual build from commit ${{ needs.validate.outputs.commit_hash }})"
          fi

          # Get existing release assets
          existing_assets=$(gh release view "$version_name" --json assets -q '.assets[].name')

          # Upload missing artifacts
          for arch in amd64 arm64; do
            local_path="./builds/$version_name/$arch/firecracker"
            if [[ ! -f "$local_path" ]]; then
              continue
            fi

            asset_name="firecracker-${arch}"

            if echo "$existing_assets" | grep -q "^${asset_name}$"; then
              echo "Release: $arch artifact already exists, skipping"
            else
              echo "Release: Uploading $arch artifact..."
              # Create temp file with correct name
              tmp_file=$(mktemp -d)/${asset_name}
              cp "$local_path" "$tmp_file"
              gh release upload "$version_name" "$tmp_file"
              rm -f "$tmp_file"
            fi

            # Upload amd64 binary also as "firecracker" for backwards compatibility
            if [[ "$arch" == "amd64" ]]; then
              if echo "$existing_assets" | grep -q "^firecracker$"; then
                echo "Release: legacy 'firecracker' artifact already exists, skipping"
              else
                echo "Release: Uploading legacy 'firecracker' artifact for backwards compatibility..."
                tmp_file=$(mktemp -d)/firecracker
                cp "$local_path" "$tmp_file"
                gh release upload "$version_name" "$tmp_file"
                rm -f "$tmp_file"
              fi
            fi

            # Debug-only artifacts: the gdb-enabled FC binary and its DWARF
            # companion. Uploaded as firecracker-debug-<arch>[.debug].
            for dbg in firecracker-debug firecracker-debug.debug; do
              dbg_path="./builds/$version_name/$arch/$dbg"
              [[ -f "$dbg_path" ]] || continue
              dbg_asset="${dbg/firecracker-debug/firecracker-debug-${arch}}"
              if echo "$existing_assets" | grep -q "^${dbg_asset}$"; then
                echo "Release: $dbg_asset already exists, skipping"
              else
                echo "Release: Uploading $dbg_asset..."
                tmp_file=$(mktemp -d)/${dbg_asset}
                cp "$dbg_path" "$tmp_file"
                gh release upload "$version_name" "$tmp_file"
                rm -f "$tmp_file"
              fi
            done
          done

          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/$version_name"


  deploy:
    needs: [validate, publish]
    strategy:
      fail-fast: false
      matrix:
        environment: [staging, juliett, foxtrot]
    runs-on: ubuntu-24.04
    environment: ${{ matrix.environment }}
    steps:
      - name: Setup GCS credentials
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version_name="${{ needs.validate.outputs.version_name }}"

          for arch in amd64 arm64; do
            mkdir -p ./builds/$version_name/$arch
            gh release download "$version_name" \
              --repo "${{ github.repository }}" \
              --pattern "firecracker-${arch}" \
              --output "./builds/$version_name/$arch/firecracker" 2>/dev/null || true
            # Debug-only artifacts (gdb binary + DWARF companion).
            gh release download "$version_name" \
              --repo "${{ github.repository }}" \
              --pattern "firecracker-debug-${arch}" \
              --output "./builds/$version_name/$arch/firecracker-debug" 2>/dev/null || true
            gh release download "$version_name" \
              --repo "${{ github.repository }}" \
              --pattern "firecracker-debug-${arch}.debug" \
              --output "./builds/$version_name/$arch/firecracker-debug.debug" 2>/dev/null || true
          done

      - name: Upload to GCS
        env:
          GCP_BUCKET_NAME: ${{ vars.GCP_BUCKET_NAME }}
        run: |
          version_name="${{ needs.validate.outputs.version_name }}"

          for arch in amd64 arm64; do
            # Upload the prod binary and the debug-only artifacts. The debug
            # binary/symbols live at a different name ("firecracker-debug"), so
            # client nodes — which resolve exactly "firecracker" — never pull them.
            for name in firecracker firecracker-debug firecracker-debug.debug; do
              local_path="./builds/$version_name/$arch/$name"
              [[ -f "$local_path" ]] || continue

              gcs_path="gs://${GCP_BUCKET_NAME}/firecrackers/${version_name}/${arch}/${name}"

              if gcloud storage ls "$gcs_path" >/dev/null 2>&1; then
                echo "GCS (${{ matrix.environment }}): $name $arch already exists, skipping"
              else
                echo "GCS (${{ matrix.environment }}): Uploading $name $arch..."
                gcloud storage cp "$local_path" "$gcs_path"
              fi
            done
          done
