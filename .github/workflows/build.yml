name: Build Firecracker Versions

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      hash:
        required: true
        type: string
      version_name:
        required: true
        type: string
      arch:
        required: true
        type: string
        description: "Target architecture: amd64 or arm64"
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ inputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Firecracker ${{ inputs.version_name }} (${{ inputs.arch }})
        run: ./build.sh "${{ inputs.version }}" "${{ inputs.hash }}" "${{ inputs.version_name }}" "${{ inputs.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: firecracker-${{ inputs.version_name }}-${{ inputs.arch }}
          path: builds/
          retention-days: 7
