name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Parse .tool-versions
        uses: wistia/parse-tool-versions@v2.1.1

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: ${{ env.UV }}
          python-version: ${{ env.PYTHON }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests
        run: uv run pytest -v
